[package]
name = "er-overlay"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", package = "eldenring" }
fromsoftware_shared = { git = "https://github.com/vswarte/fromsoftware-rs", package = "fromsoftware-shared" }
serde = { version = "1.0", features = ["derive"] }
winapi = { version = "0.3.9", features = ["libloaderapi"] }
toml = "0.9.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
] }
serde_json = "1.0.145"

hudhook = "0.8.2"
imgui = "0.12.0"
crossbeam = "0.8"
